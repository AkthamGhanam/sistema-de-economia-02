<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f3f3f2" />
    <title>BytesAcademy</title>
    <link rel="icon" href="/img/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/img/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,400..800;1,14..32,700..900&display=swap" />
    <link rel="stylesheet" href="/css/styles.css?v=__V__" />
    <script src="/js/theme.js?v=__V__"></script>
  </head>
  <body>
    <div id="as-banner"></div>
    <div class="shell">
      <aside class="sidebar">
        <a class="brand" href="#/inicio">
          <div class="brand-logo" data-brand-logo></div>
          <div class="brand-text"><strong class="brand-lockup" data-brand-lockup></strong><span data-site-name></span></div>
        </a>
        <nav class="side-nav" id="side-nav" aria-label="Navegación principal"></nav>
        <div class="side-footer">
          <div class="user-card">
            <div class="avatar" data-user-avatar></div>
            <div class="meta"><strong data-user-name></strong><span data-user-role></span></div>
            <button type="button" class="icon-btn sm plain" data-logout title="Cerrar sesión" aria-label="Cerrar sesión"></button>
          </div>
        </div>
      </aside>

      <div class="main">
        <header class="topbar">
          <div class="topbar-left">
            <a href="#/inicio" class="brand-logo" data-brand-logo aria-label="Inicio"></a>
            <div class="topbar-title"><h1 id="page-title">Inicio</h1><p id="page-sub" hidden></p></div>
          </div>
          <div class="topbar-actions">
            <button type="button" class="icon-btn" data-theme-toggle></button>
            <button type="button" class="icon-btn mobile-only" data-logout title="Cerrar sesión" aria-label="Cerrar sesión"></button>
          </div>
        </header>
        <main id="view" class="view"></main>
      </div>

      <nav class="bottom-nav" id="bottom-nav" aria-label="Navegación"></nav>
    </div>
    <div id="modal-root"></div>
    <div id="toast-root"></div>

    <script src="/js/common.js?v=__V__"></script>
    <script src="/js/student.js?v=__V__"></script>
  </body>
</html>
